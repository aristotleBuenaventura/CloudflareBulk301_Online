name = "bulk301-scheduler"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Check every minute. Actual apply time is editable in the UI (config.applyTime + timezone).
[triggers]
crons = ["* * * * *"]

# Replace ids after: npm run kv:create (from worker/)
[[kv_namespaces]]
binding = "CONFIG"
id = "f27b958fadb24c5b9e04e7e7022153c0"
preview_id = "b512bab0241f45f0af1ace966a3e4366"

[vars]
TIMEZONE = "Asia/Manila"
PUBLIC_INTERNET = "true"
ALLOWED_ORIGINS = "https://gachuoi.app"
IP_ALLOWLIST = "110.235.166.92,2400:6a80:8610:37e0:ccab:e4fa:28ae:3959"
COOKIE_SAMESITE = "None"
APP_URL = "https://gachuoi.app"
# BIND_SESSION_IP = "true"

# Secrets (set via CLI — never commit):
#   npx wrangler secret put CLOUDFLARE_API_TOKEN
#   npx wrangler secret put CLOUDFLARE_API_TOKEN_2
#   npx wrangler secret put ADMIN_SECRET
#   npx wrangler secret put SMTP_PASS
# Optional vars/secrets for forgot-password email:
#   APP_URL, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_FROM
# ADMIN_SECRET must be 16+ chars and not a placeholder when PUBLIC_INTERNET=true
#
# Token least privilege (recommended):
#   Zone → Zone: Read
#   Zone → Page Rules: Edit
#   Zone → Single Redirect: Edit
#   Zone resources: only zones you manage (not Account Administrator)
# CLOUDFLARE_API_TOKEN → Account 1 domains; CLOUDFLARE_API_TOKEN_2 → Account 2 domains.
